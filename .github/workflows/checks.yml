name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, gd
          coverage: none
      - name: PHP syntax
        run: find app bin config public/api tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commerce rules
        run: php tests/commerce.php
      - name: Database upgrade
        run: php tests/migration.php
      - name: HTTP integration
        run: python3 tests/integration_http.py /usr/bin/php
      - name: JavaScript syntax
        run: for file in public/assets/*.js; do node --check "$file"; done
