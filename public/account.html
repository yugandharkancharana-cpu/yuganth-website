<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Your account · Yuganth</title><link rel="stylesheet" href="assets/commerce.css"></head><body class="commerce-page account-page"><header class="commerce-header"><a class="commerce-brand" href="index.html">YUGANTH</a><a href="checkout.html">Checkout</a></header><main class="commerce-main"><p class="account-eyebrow">THE YUGANTH PANTRY</p><h1>Welcome to Yuganth.</h1><p id="message" class="commerce-message" role="status" aria-live="polite"></p><div id="auth" class="auth-shell"><div class="auth-tabs" role="tablist" aria-label="Your account"><button type="button" id="signInTab" role="tab" aria-selected="true" aria-controls="signInPanel">Sign in</button><button type="button" id="signUpTab" role="tab" aria-selected="false" aria-controls="signUpPanel">Create account</button></div><section id="signInPanel" role="tabpanel" aria-labelledby="signInTab" class="commerce-panel"><h2>Good to see you.</h2><form id="login"><label for="loginEmail">Email</label><input id="loginEmail" name="email" type="email" autocomplete="username" required><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="72" required><button>Sign in</button></form><button id="forgot">Forgot password?</button></section><section id="signUpPanel" role="tabpanel" aria-labelledby="signUpTab" class="commerce-panel" hidden><h2>A little more flavour.</h2><form id="register"><label for="registerName">Name</label><input id="registerName" name="name" autocomplete="name" maxlength="120" required><label for="registerEmail">Email</label><input id="registerEmail" name="email" type="email" autocomplete="email" required><label for="registerPassword">Password (at least 12 characters)</label><input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required><button>Create account</button></form></section></div><form id="reset" class="commerce-panel" hidden><h2>Choose a new password.</h2><label for="newPassword">New password</label><input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required><button>Save password</button></form><section id="profile" hidden><p id="greeting"></p><a id="adminLink" href="admin.html" hidden>Open store administration</a><button id="logout">Sign out</button><section class="commerce-panel" id="ordersSection"><h2>Your orders</h2><div id="orders"></div></section><section class="commerce-panel" id="addressesSection"><h2>Saved addresses</h2><div id="addresses"></div><form id="addressForm"><label for="addressName">Recipient name</label><input id="addressName" name="name" autocomplete="name" maxlength="120" required><label for="addressPhone">Mobile number</label><input id="addressPhone" name="phone" autocomplete="tel-national" inputmode="tel" pattern="[6-9][0-9]{9}" maxlength="10" required><label for="addressLine1">Address</label><input id="addressLine1" name="line1" autocomplete="address-line1" maxlength="200" required><label for="addressLine2">Address line 2</label><input id="addressLine2" name="line2" autocomplete="address-line2" maxlength="200"><label for="addressCity">City</label><input id="addressCity" name="city" autocomplete="address-level2" maxlength="100" required><label for="addressState">State</label><input id="addressState" name="state" autocomplete="address-level1" maxlength="100" required><label for="addressPincode">Postcode</label><input id="addressPincode" name="pincode" autocomplete="postal-code" inputmode="numeric" pattern="[1-9][0-9]{5}" maxlength="6" required><button>Save address</button></form></section></section></main><script src="assets/api.js"></script><script src="assets/account.js?v=ux-20261029"></script></body></html>
