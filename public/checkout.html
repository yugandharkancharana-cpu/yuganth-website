<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Checkout · Yuganth</title><link rel="stylesheet" href="assets/commerce.css"></head><body class="commerce-page"><header class="commerce-header"><a class="commerce-brand" href="index.html">YUGANTH</a><a href="account.html">My account</a></header><main class="commerce-main"><a href="index.html#shop">← Continue shopping</a><h1>Your next flavour.</h1><p id="message" class="commerce-message" role="status" aria-live="polite"></p><div class="commerce-columns"><section class="commerce-panel"><h2>Delivery details</h2><p class="small">Sign in before ordering. Delivery currently supports configured Indian postcodes only.</p><form id="checkoutForm"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" maxlength="120" required><label for="phone">Mobile number</label><input id="phone" name="phone" inputmode="tel" autocomplete="tel-national" pattern="[6-9][0-9]{9}" maxlength="10" required><label for="line1">Address</label><input id="line1" name="line1" autocomplete="address-line1" maxlength="200" required><label for="line2">Address line 2 (optional)</label><input id="line2" name="line2" autocomplete="address-line2" maxlength="200"><label for="city">City</label><input id="city" name="city" autocomplete="address-level2" maxlength="100" required><label for="state">State</label><input id="state" name="state" autocomplete="address-level1" maxlength="100" required><label for="pincode">Postcode</label><input id="pincode" name="pincode" autocomplete="postal-code" inputmode="numeric" pattern="[1-9][0-9]{5}" maxlength="6" required><label for="coupon">Coupon (optional)</label><input id="coupon" name="coupon" maxlength="40"><button type="button" id="quote">Check delivery & total</button><p class="small">Review the server-calculated total before placing your order.</p><button id="place" type="submit" disabled>Continue to payment</button></form></section><aside class="commerce-panel"><h2>Your bag</h2><div id="summary"></div><div id="totals" aria-live="polite"></div><div id="payment"></div></aside></div></main><script src="assets/api.js"></script><script src="assets/checkout.js"></script></body></html>
